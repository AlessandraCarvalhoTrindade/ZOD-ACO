<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zodíaco</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <div class="stars"></div>

        <section class="card">

            <div class="icon">✦</div>

            <h1>ZODÍACO</h1>

            <p class="subtitle">
                Descubra o que os astros dizem sobre você
            </p>

            <label for="birthdate">
                Qual é a sua data de nascimento?
            </label>

            <input
                type="date"
                id="birthdate"
            >

            <button id="discoverBtn">
                ✨ Descobrir meu signo
            </button>

            <div id="result" class="result"></div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
